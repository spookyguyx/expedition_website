{% extends 'main/layout.html' %}
{% load static %}
{% block title %}Поиск{% endblock %}
{% block style1 %}
<link rel="stylesheet" href="{% static 'css/search.css' %}">
{% endblock %}
{% block content %}
<div class="search_page">
    <div class="container-2">
        <h3 class="text-search">Поиск</h3>
         <form class="search-wrapper2" action="{% url 'search_results' %}" method="get">
                                <input name="q" type="search" placeholder="Поиск..." class="form-control">
         </form>
        <div class="border-bottom"></div>
       <p>Результаты поиска</p>
        <ul>
            {% for el in object_list %}
                <li>
                    <a href="{% url 'expedition' el.article_slug %}">
                        <div class="expedition_item">
                            <img class="img_search" src="{{ el.photo_main_page.url }}">
                            <div class="expedition_info">
                                <p>{{ el.name }}</p>
                                <p>{{ el.name_long }}</p>
                            </div>
                        </div>
                </div>
    </div>
</div>
{% endblock %}
